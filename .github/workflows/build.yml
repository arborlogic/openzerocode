name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release, e.g. v0.3.3. Leave empty to only build artifacts."
        required: false
        type: string
      publish_to_npm:
        description: "Publish npm packages"
        required: false
        default: false
        type: boolean
      create_github_release:
        description: "Create GitHub Release"
        required: false
        default: false
        type: boolean

jobs:
  build-root-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: bun install --frozen-lockfile

      - name: Generate npm package metadata
        run: node scripts/create-platform-packages.mjs

      - name: Pack root npm package
        run: npm pack ./npm

      - name: Upload root npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-root
          path: openzerocode-*.tgz

  build-platform-package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: bun install --frozen-lockfile

      - name: Build platform package
        shell: bash
        run: bash scripts/build-platform-package.sh ${{ matrix.target }}

      - name: Create direct binary archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TARGET="${{ matrix.target }}"
          BINARY_NAME="openzerocode"
          if [[ "$TARGET" == win32-* ]]; then
            BINARY_NAME="openzerocode.exe"
          fi

          STAGE_DIR="release/${APP_NAME:-openzerocode}-${TARGET}-${VERSION}"
          mkdir -p "$STAGE_DIR/bin"
          cp "npm/packages/$TARGET/bin/$BINARY_NAME" "$STAGE_DIR/bin/$BINARY_NAME"
          chmod 755 "$STAGE_DIR/bin/$BINARY_NAME"

          mkdir -p release-artifacts
          if [[ "$TARGET" == win32-* ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$STAGE_DIR/*' -DestinationPath 'release-artifacts/openzerocode-$TARGET-$VERSION.zip' -Force"
          else
            tar -czf "release-artifacts/openzerocode-$TARGET-$VERSION.tar.gz" -C release "openzerocode-$TARGET-$VERSION"
          fi

      - name: Upload direct binary archive
        uses: actions/upload-artifact@v4
        with:
          name: binary-archive-${{ matrix.target }}
          path: release-artifacts/openzerocode-*

      - name: Pack platform package
        run: npm pack ./npm/packages/${{ matrix.target }}

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ matrix.target }}
          path: openzerocode-*.tgz

  publish-npm:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_npm)
    needs: [build-root-package, build-platform-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          always-auth: true

      - name: Download all npm packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify npm auth is configured
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN secret is not configured for this repository/environment." >&2
            exit 1
          fi

      - name: Verify npm authentication
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Publish npm packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          package_exists() {
            local name="$1"
            local version="$2"

            npm view "$name@$version" version --silent >/dev/null 2>&1
          }

          publish_if_missing() {
            local tarball="$1"
            local name version

            name="$(npm pkg get name --package "$tarball" | node -pe 'JSON.parse(fs.readFileSync(0, "utf8"))')"
            version="$(npm pkg get version --package "$tarball" | node -pe 'JSON.parse(fs.readFileSync(0, "utf8"))')"

            if package_exists "$name" "$version"; then
              echo "Skipping $name@$version because it already exists on npm."
              return 0
            fi

            echo "Publishing $name@$version from $tarball"
            npm publish "$tarball" --access public
          }

          root_package="$(find artifacts -path '*/npm-package-root/*.tgz' | head -n 1)"
          if [[ -z "$root_package" ]]; then
            echo "Root npm package tarball not found under artifacts/." >&2
            exit 1
          fi

          mapfile -d '' platform_packages < <(find artifacts -path '*/npm-package-*/*.tgz' ! -path '*/npm-package-root/*' -print0 | sort -z)

          if [[ ${#platform_packages[@]} -eq 0 ]]; then
            echo "No platform package tarballs found under artifacts/." >&2
            exit 1
          fi

          for pkg in "${platform_packages[@]}"; do
            publish_if_missing "$pkg"
          done

          publish_if_missing "$root_package"

  release:
    if: github.ref_type == 'tag' || inputs.create_github_release
    needs: [build-root-package, build-platform-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          TAG=""

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
          fi

          if [[ -z "$TAG" ]]; then
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "No release tag provided; skipping GitHub Release creation."
            exit 0
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.release_tag.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.release_tag }}
          name: ${{ steps.release_tag.outputs.release_tag }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tgz
            artifacts/binary-archive-*/*
            install
